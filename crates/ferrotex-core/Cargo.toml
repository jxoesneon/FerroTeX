[package]
name = "ferrotex-core"
version = "0.24.0"
edition = "2021"
description = "Core package management and validation utilities for FerroTeX"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jxoesneon/FerroTeX"
homepage = "https://jxoesneon.github.io/FerroTeX/"
rust-version = "1.85"
keywords = ["latex", "tex", "package-manager"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
tokio = { version = "1.52", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "8.0"
once_cell = "1.18"
log = "0.4"
async-trait = "0.1.89"
ferrotex-build = { path = "../ferrotex-build" }



