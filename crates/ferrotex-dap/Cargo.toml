[package]
name = "ferrotex-dap"
version = "0.22.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
sha2 = "0.10"
hex = "0.4"
# crossbeam-channel = "0.5" # Likely needed for message passing
# dap-types? Writing raw for now to avoid bulky deps
ferrotex-build = { path = "../ferrotex-build", version = "0.22.0" }

[features]
default = []
jxoesneon-tectonic-engine = ["jxoesneon-tectonic", "jxoesneon-tectonic-status_base", "jxoesneon-tectonic-io_base", "jxoesneon-tectonic-bridge_core"]

[dependencies.jxoesneon-tectonic]
package = "tectonic"
git = "https://github.com/jxoesneon/tectonic"
version = "0.17.3"
default-features = false
optional = true

[dependencies.jxoesneon-tectonic-status_base]
package = "tectonic_status_base"
git = "https://github.com/jxoesneon/tectonic"
version = "0.17.3"
optional = true

[dependencies.jxoesneon-tectonic-io_base]
package = "tectonic_io_base"
git = "https://github.com/jxoesneon/tectonic"
version = "0.17.3"
optional = true

[dependencies.jxoesneon-tectonic-bridge_core]
package = "tectonic_bridge_core"
git = "https://github.com/jxoesneon/tectonic"
version = "0.17.3"
optional = true

[dev-dependencies]
tempfile = "3.27"
