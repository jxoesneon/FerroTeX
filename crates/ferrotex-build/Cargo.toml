[package]
name = "ferrotex-build"
version = "0.24.0"
edition = "2024"
description = "Content-addressable DAG build system for FerroTeX"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jxoesneon/FerroTeX"
homepage = "https://jxoesneon.github.io/FerroTeX/"
rust-version = "1.85"
keywords = ["latex", "build-system", "tex", "reproducible"]
categories = ["development-tools", "build-utils"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
sha2 = "0.11"
hex = "0.4"

