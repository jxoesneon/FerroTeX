[package]
name = "ferrotex-cli"
version = "0.24.0"
edition = "2021"
description = "CLI for FerroTeX tools"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jxoesneon/FerroTeX"
homepage = "https://jxoesneon.github.io/FerroTeX/"
rust-version = "1.85"
keywords = ["latex", "cli", "tex", "build"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[features]
default = []
# jxoesneon-tectonic-engine = ["ferrotex-dap/jxoesneon-tectonic-engine"]

[dependencies]
ferrotex-log = { path = "../ferrotex-log", version = "0.24.0" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
notify = "8.2"
ferrotex-dap = { path = "../ferrotex-dap", version = "0.24.0" }
ferrotex-build = { path = "../ferrotex-build", version = "0.24.0" }
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"


