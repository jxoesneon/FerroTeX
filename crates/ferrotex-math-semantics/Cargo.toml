[package]
name = "ferrotex-math-semantics"
version = "0.24.0"
edition = "2024"
description = "Formal semantics and shape analysis for LaTeX math environments"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jxoesneon/FerroTeX"
homepage = "https://jxoesneon.github.io/FerroTeX/"
rust-version = "1.85"
keywords = ["latex", "math", "semantics", "tex"]
categories = ["mathematics", "development-tools"]

[lints]
workspace = true

[dependencies]
ferrotex-syntax = { path = "../ferrotex-syntax", version = "0.24.0" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
rowan = "0.17"

[dev-dependencies]
expect-test = "1.4"
