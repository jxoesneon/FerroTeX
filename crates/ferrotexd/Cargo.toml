[package]
name = "ferrotexd"
version = "0.24.0"
edition = "2021"
description = "FerroTeX language server (LSP/DAP) for LaTeX"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jxoesneon/FerroTeX"
homepage = "https://jxoesneon.github.io/FerroTeX/"
rust-version = "1.85"
keywords = ["latex", "lsp", "language-server", "tex", "editor"]
categories = ["development-tools", "text-editors"]

[lints]
workspace = true

[dependencies]
tokio = { version = "1.52", features = ["full"] }
tower-lsp = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
dashmap = "6.2"
crossbeam-channel = "0.5"
notify = "8.2"
reqwest = { version = "0.13", features = ["blocking", "json"] }
zip = "8.6"
tempfile = "3.8"
url = "2.5"
glob = "0.3"
walkdir = "2.4"
regex = "1.10"
uuid = { version = "1.23", features = ["v4"] }
line-index = "0.1"
dirs = "6.0"
which = "8.0"
once_cell = "1.18"
lazy_static = "1.4"
rowan = "0.16"
async-trait = "0.1"

ferrotex-syntax = { path = "../ferrotex-syntax", version = "0.24.0" }
ferrotex-log = { path = "../ferrotex-log", version = "0.24.0" }
ferrotex-package = { path = "../ferrotex-package", version = "0.24.0" }
ferrotex-math-semantics = { path = "../ferrotex-math-semantics", version = "0.24.0" }
ferrotex-core = { path = "../ferrotex-core", version = "0.24.0" }

[dependencies.jxoesneon-tectonic]
package = "tectonic"
git = "https://github.com/jxoesneon/tectonic"
version = "0.17.3"
default-features = false
optional = true

[features]
default = []
use-jxoesneon-tectonic = ["jxoesneon-tectonic"]

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }
