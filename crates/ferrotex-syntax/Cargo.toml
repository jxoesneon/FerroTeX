[package]
name = "ferrotex-syntax"
version = "0.24.0"
edition = "2024"
description = "Fault-tolerant LaTeX parser for FerroTeX"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jxoesneon/FerroTeX"
homepage = "https://jxoesneon.github.io/FerroTeX/"
rust-version = "1.85"
keywords = ["latex", "parser", "cst", "tex"]
categories = ["parser-implementations", "text-processing"]

[lints]
workspace = true

[dependencies]
rowan = "0.17"
ferrotex-build = { path = "../ferrotex-build" }


[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "parser_benchmark"
harness = false
