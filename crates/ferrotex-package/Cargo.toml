[package]
name = "ferrotex-package"
version = "0.24.0"
edition = "2021"
description = "LaTeX package indexing and metadata for FerroTeX"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jxoesneon/FerroTeX"
homepage = "https://jxoesneon.github.io/FerroTeX/"
rust-version = "1.85"
keywords = ["latex", "tex", "package"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.5"
walkdir = "2.3"
dirs = "6.0"
log = "0.4"
anyhow = "1.0"
